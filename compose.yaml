
name: servi-red

services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: servi-red-rabbitmq
    restart: unless-stopped

    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: servi_red
      RABBITMQ_DEFAULT_PASS: servi_red_dev_2026

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile

    container_name: servi-red-worker
    restart: unless-stopped

    env_file:
      - .env.local

    environment:
      RABBITMQ_URL: amqp://servi_red:servi_red_dev_2026@rabbitmq:5672
      RABBITMQ_QUEUE: servi-red.reportes

    depends_on:
      rabbitmq:
        condition: service_healthy

  indicadores:
    build:
      context: ./services/indicadores
      dockerfile: Dockerfile
    container_name: servi-red-indicadores
    restart: unless-stopped
    ports:
      - "127.0.0.1:4001:4001"
    env_file:
      - .env.indicadores.local
    environment:
      PORT: "4001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4001/health', { signal: AbortSignal.timeout(4000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  denuncias:
    build:
      context: ./services/denuncias
      dockerfile: Dockerfile
    container_name: servi-red-denuncias
    restart: unless-stopped
    ports:
      - "127.0.0.1:4002:4002"
    env_file:
      - .env.denuncias.local
    environment:
      PORT: "4002"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4002/health', { signal: AbortSignal.timeout(4000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  rabbitmq_data:
